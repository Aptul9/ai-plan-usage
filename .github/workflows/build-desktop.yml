name: Build desktop apps

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows EXE
    runs-on: windows-latest

    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            apps/ui/package-lock.json
            apps/tauri/package-lock.json

      - name: Install shared UI dependencies
        working-directory: apps/ui
        run: npm ci

      - name: Install Tauri JavaScript CLI
        working-directory: apps/tauri
        run: npm ci

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/tauri/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('apps/tauri/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build Tauri EXE
        run: npm --prefix apps/tauri run build

      - name: Collect EXEs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          New-Item -ItemType Directory -Force -Path artifacts | Out-Null

          $tauriConfig = Get-Content -Raw apps/tauri/src-tauri/tauri.conf.json | ConvertFrom-Json
          $tauriExe = 'apps/tauri/src-tauri/target/release/ai-plan-usage.exe'
          if (-not (Test-Path $tauriExe)) {
            throw "Tauri EXE not found: $tauriExe"
          }
          Copy-Item -Path $tauriExe -Destination "artifacts/ai-plan-usage-tauri-$($tauriConfig.version)-windows-x64.exe" -Force

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.5
          cache: true

      - name: Build Flutter app
        working-directory: apps/flutter
        run: flutter build windows --release

      - name: Build Flutter installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "choco install innosetup failed (exit $LASTEXITCODE)" }
          }

          $version = (Select-String -Path apps/flutter/pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          & $iscc /Q "/DAppVersion=$version" "/DOutputDir=$PWD\artifacts" apps/flutter/installer/ai-plan-usage.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed (exit $LASTEXITCODE)" }

          Get-ChildItem -Path artifacts -Filter '*.exe' -File |
            Sort-Object Name |
            Format-Table Name, Length

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-desktop-exes
          path: artifacts/*.exe
          if-no-files-found: error

      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GITHUB_REF_NAME

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --title $tag --generate-notes
          }

          $assetPaths = @(Get-ChildItem -Path artifacts -Filter '*-setup.exe' -File |
            Sort-Object Name |
            ForEach-Object { $_.FullName })
          if (-not $assetPaths) {
            throw 'No installer found to upload.'
          }

          gh release upload $tag $assetPaths --repo $env:GITHUB_REPOSITORY --clobber

  servizi:
    name: servizi download
    needs: windows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # tag uploads one at a time, a later tag waits; every other run is a dry run with its own group
    concurrency:
      group: ${{ startsWith(github.ref, 'refs/tags/v') && 'servizi-download' || format('servizi-dry-run-{0}', github.run_id) }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download installer
        uses: actions/download-artifact@v7
        with:
          name: windows-desktop-exes
          path: built

      - name: Prepare servizi files
        env:
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          version=$(sed -nE 's/^version:[[:space:]]*([0-9.]+).*/\1/p' apps/flutter/pubspec.yaml)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pubspec version $version" >&2
            exit 1
          fi
          scripts/servizi-download.sh "built/ai-plan-usage-$version-windows-x64-setup.exe" "$version" "$COMMIT" servizi

      - name: Publish on servizi.everbright.it
        # tags pushed to this repository only: never pull requests, forks or branch runs
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'Aptul9/ai-plan-usage'
        working-directory: servizi
        env:
          SSH_KEY: ${{ secrets.SERVIZI_DOWNLOAD_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.SERVIZI_KNOWN_HOSTS }}
          TARGET: servizi@${{ secrets.SERVIZI_HOST }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          url=https://servizi.everbright.it/download
          exe=AI-Plan-Usage-Windows-x64-Setup.exe
          json=AI-Plan-Usage-Windows-x64.json
          hash=$(jq -r .sha256 "$json")
          test "$(sha256sum "$exe" | cut -d' ' -f1)" = "$hash"
          # the key's forced command (ricevi-build) only accepts "<name> <sha256>" with the file on stdin
          ssh -q -o BatchMode=yes "$TARGET" "$exe $hash" < "$exe"
          test "$(curl -fsS --max-time 120 "$url/$exe" | sha256sum | cut -d' ' -f1)" = "$hash"
          # the JSON goes last, so it never names an installer that is not there yet
          meta=$(sha256sum "$json" | cut -d' ' -f1)
          ssh -q -o BatchMode=yes "$TARGET" "$json $meta" < "$json"
          test "$(curl -fsS --max-time 30 "$url/$json" | sha256sum | cut -d' ' -f1)" = "$meta"
          echo "$url/$exe $hash"
