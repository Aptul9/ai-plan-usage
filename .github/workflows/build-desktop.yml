name: Build desktop apps

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows EXEs
    runs-on: windows-latest

    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            apps/ui/package-lock.json
            apps/electron/package-lock.json

      - name: Install shared UI dependencies
        working-directory: apps/ui
        run: npm ci

      - name: Install Electron dependencies
        working-directory: apps/electron
        run: npm ci

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/tauri/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('apps/tauri/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build Electron portable EXE
        run: npm --prefix apps/electron run package

      - name: Build Tauri EXE
        run: npm --prefix apps/tauri run build

      - name: Collect EXEs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          New-Item -ItemType Directory -Force -Path artifacts | Out-Null

          $tauriConfig = Get-Content -Raw apps/tauri/src-tauri/tauri.conf.json | ConvertFrom-Json
          $tauriExe = 'apps/tauri/src-tauri/target/release/ai-plan-usage.exe'
          if (-not (Test-Path $tauriExe)) {
            throw "Tauri EXE not found: $tauriExe"
          }
          Copy-Item -Path $tauriExe -Destination "artifacts/ai-plan-usage-tauri-$($tauriConfig.version)-windows-x64.exe" -Force

          $electronExe = Get-ChildItem -Path apps/electron/dist-packaged -Filter '*.exe' -File |
            Sort-Object Name |
            Select-Object -First 1
          if (-not $electronExe) {
            throw 'Electron EXE not found under apps/electron/dist-packaged'
          }
          Copy-Item -Path $electronExe.FullName -Destination "artifacts/$($electronExe.Name)" -Force

          Get-ChildItem -Path artifacts -Filter '*.exe' -File |
            Sort-Object Name |
            Format-Table Name, Length

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-exes
          path: artifacts/*.exe
          if-no-files-found: error

      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GITHUB_REF_NAME

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --title $tag --generate-notes
          }

          $assetPaths = Get-ChildItem -Path artifacts -Filter '*.exe' -File |
            Sort-Object Name |
            ForEach-Object { $_.FullName }
          if (-not $assetPaths) {
            throw 'No EXE assets found to upload.'
          }

          gh release upload $tag @assetPaths --repo $env:GITHUB_REPOSITORY --clobber
